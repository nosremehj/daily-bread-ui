@if (open) {
  <div class="overlay" (click)="onOverlayClick()" aria-hidden="true"></div>
  <div
    class="modal glass"
    role="dialog"
    aria-modal="true"
    aria-labelledby="pwd-dialog-title"
    (click)="$event.stopPropagation()"
  >
    <div class="modal-header">
      <h2 id="pwd-dialog-title">Alterar senha</h2>
      <button
        type="button"
        class="btn-icon"
        (click)="close()"
        [disabled]="submitting()"
        aria-label="Fechar"
      >
        <i class="uil uil-times" aria-hidden="true"></i>
      </button>
    </div>
    <p class="hint">Informe a senha atual e a nova senha (mínimo 8 caracteres).</p>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <label class="field">
        <span class="field-label">Senha atual</span>
        <input
          type="password"
          formControlName="currentPassword"
          autocomplete="current-password"
          class="input"
          [class.invalid]="
            form.controls.currentPassword.invalid && form.controls.currentPassword.touched
          "
        />
        @if (form.controls.currentPassword.invalid && form.controls.currentPassword.touched) {
          <span class="field-error">Informe a senha atual.</span>
        }
      </label>

      <label class="field">
        <span class="field-label">Nova senha</span>
        <input
          type="password"
          formControlName="newPassword"
          autocomplete="new-password"
          class="input"
          [class.invalid]="
            form.controls.newPassword.invalid && form.controls.newPassword.touched
          "
        />
        @if (form.controls.newPassword.invalid && form.controls.newPassword.touched) {
          <span class="field-error">Mínimo 8 caracteres.</span>
        }
      </label>

      <label class="field">
        <span class="field-label">Confirmar nova senha</span>
        <input
          type="password"
          formControlName="confirmPassword"
          autocomplete="new-password"
          class="input"
          [class.invalid]="
            (form.controls.confirmPassword.invalid || form.hasError('passwordMismatch')) &&
            form.controls.confirmPassword.touched
          "
        />
        @if (form.hasError('passwordMismatch') && form.controls.confirmPassword.touched) {
          <span class="field-error">As senhas não coincidem.</span>
        }
      </label>

      @if (serverError()) {
        <p class="error" role="alert">{{ serverError() }}</p>
      }

      <div class="actions">
        <button type="button" class="btn-secondary" (click)="close()" [disabled]="submitting()">
          Cancelar
        </button>
        <button type="submit" class="btn-primary inline" [disabled]="submitting()">
          @if (submitting()) {
            <span>Salvando…</span>
          } @else {
            <span>Confirmar</span>
          }
        </button>
      </div>
    </form>
  </div>
}
