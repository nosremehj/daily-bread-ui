@if (open) {
  <div class="overlay" (click)="onOverlayClick()" aria-hidden="true"></div>
  <div
    class="modal glass"
    role="dialog"
    aria-modal="true"
    aria-labelledby="pwd-dialog-title"
    (click)="$event.stopPropagation()"
  >
    <div class="modal-header">
      <h2 id="pwd-dialog-title">{{ 'modals.changePassword.title' | transloco }}</h2>
      <button
        type="button"
        class="btn-icon"
        (click)="close()"
        [disabled]="submitting()"
        [attr.aria-label]="'common.actions.close' | transloco"
      >
        <i class="uil uil-times" aria-hidden="true"></i>
      </button>
    </div>
    <p class="hint">{{ 'modals.changePassword.hint' | transloco }}</p>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <label class="field">
        <span class="field-label">{{ 'modals.changePassword.current' | transloco }}</span>
        <input
          type="password"
          formControlName="currentPassword"
          autocomplete="current-password"
          class="input"
          [class.invalid]="
            form.controls.currentPassword.invalid && form.controls.currentPassword.touched
          "
        />
        @if (form.controls.currentPassword.invalid && form.controls.currentPassword.touched) {
          <span class="field-error">{{ 'modals.changePassword.currentError' | transloco }}</span>
        }
      </label>

      <label class="field">
        <span class="field-label">{{ 'modals.changePassword.new' | transloco }}</span>
        <input
          type="password"
          formControlName="newPassword"
          autocomplete="new-password"
          class="input"
          [class.invalid]="
            form.controls.newPassword.invalid && form.controls.newPassword.touched
          "
        />
        @if (form.controls.newPassword.invalid && form.controls.newPassword.touched) {
          <span class="field-error">{{ 'modals.changePassword.newError' | transloco }}</span>
        }
      </label>

      <label class="field">
        <span class="field-label">{{ 'modals.changePassword.confirm' | transloco }}</span>
        <input
          type="password"
          formControlName="confirmPassword"
          autocomplete="new-password"
          class="input"
          [class.invalid]="
            (form.controls.confirmPassword.invalid || form.hasError('passwordMismatch')) &&
            form.controls.confirmPassword.touched
          "
        />
        @if (form.hasError('passwordMismatch') && form.controls.confirmPassword.touched) {
          <span class="field-error">{{ 'modals.changePassword.mismatch' | transloco }}</span>
        }
      </label>

      @if (serverError()) {
        <p class="error" role="alert">{{ serverError() }}</p>
      }

      <div class="actions">
        <button type="button" class="btn-secondary" (click)="close()" [disabled]="submitting()">
          {{ 'modals.changePassword.cancel' | transloco }}
        </button>
        <button type="submit" class="btn-primary inline btn-book-loading" [disabled]="submitting()">
          @if (submitting()) {
            <app-book-loading-spinner [size]="'sm'" [inline]="true" [labelKey]="'modals.changePassword.submitting'" />
          } @else {
            <span>{{ 'modals.changePassword.submit' | transloco }}</span>
          }
        </button>
      </div>
    </form>
  </div>
}
