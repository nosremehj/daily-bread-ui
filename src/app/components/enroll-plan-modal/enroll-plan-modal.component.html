@if (open && planId != null) {
  <div class="overlay" (click)="onOverlayClick()" aria-hidden="true"></div>
  <div
    class="modal glass"
    role="dialog"
    aria-modal="true"
    aria-labelledby="enroll-title"
    (click)="$event.stopPropagation()"
  >
    <div class="modal-header">
      <div class="modal-titles">
        <h2 id="enroll-title">{{ 'modals.enroll.title' | transloco }}</h2>
        <p class="filename">{{ planFilename }}</p>
        <p class="hint">
          {{ 'modals.enroll.hint' | transloco }}
        </p>
      </div>
      <button
        type="button"
        class="btn-icon"
        (click)="close()"
        [disabled]="submitting()"
        [attr.aria-label]="'common.actions.close' | transloco"
      >
        <i class="uil uil-times" aria-hidden="true"></i>
      </button>
    </div>

    <div class="form-fields">
      <label class="field">
        <span class="label">{{ 'modals.enroll.startLabel' | transloco }}</span>
        <input type="date" [value]="planStartDate()" (input)="planStartDate.set($any($event.target).value)" />
      </label>

      <label class="field">
        <span class="label">{{ 'modals.enroll.catchUpLabel' | transloco }}</span>
        <input
          type="date"
          [value]="catchUpThroughDate()"
          (input)="catchUpThroughDate.set($any($event.target).value)"
        />
        <span class="field-hint">{{ 'modals.enroll.catchUpFieldHint' | transloco }}</span>
      </label>

      <button type="button" class="btn-link" (click)="toggleAdvanced()">
        @if (showAdvanced()) {
          {{ 'modals.enroll.hideAdvanced' | transloco }}
        } @else {
          {{ 'modals.enroll.showAdvanced' | transloco }}
        }
      </button>

      @if (showAdvanced()) {
        <div class="advanced glass-inner">
          <p class="advanced-intro">
            {{ 'modals.enroll.advancedIntro' | transloco }}
          </p>
          <label class="field">
            <span class="label">{{ 'modals.enroll.from' | transloco }}</span>
            <input type="date" [value]="catchUpFrom()" (input)="catchUpFrom.set($any($event.target).value)" />
          </label>
          <label class="field">
            <span class="label">{{ 'modals.enroll.to' | transloco }}</span>
            <input type="date" [value]="catchUpTo()" (input)="catchUpTo.set($any($event.target).value)" />
          </label>
        </div>
      }
    </div>

    @if (errorMessage(); as err) {
      <p class="banner-error" role="alert">{{ err }}</p>
    }

    <div class="footer-actions">
      <button type="button" class="btn-secondary" (click)="close()" [disabled]="submitting()">
        {{ 'modals.enroll.cancel' | transloco }}
      </button>
      <button type="button" class="btn-primary inline" (click)="submit()" [disabled]="submitting()">
        @if (submitting()) {
          {{ 'modals.enroll.submitting' | transloco }}
        } @else {
          {{ 'modals.enroll.submit' | transloco }}
        }
      </button>
    </div>
  </div>
}
