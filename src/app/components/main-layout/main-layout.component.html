<div class="layout-wrapper">
  <nav class="sidebar glass" aria-label="Navegação principal">
    <div class="brand desktop-only">
      <i class="uil uil-book-reader" aria-hidden="true"></i>
      <span>Pão diário</span>
    </div>

    <div class="nav-links">
      <a
        routerLink="/home"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        class="nav-item"
      >
        <i class="uil uil-home-alt" aria-hidden="true"></i>
        <span>Início</span>
      </a>
      <a routerLink="/reading-plans" routerLinkActive="active" class="nav-item">
        <i class="uil uil-file-upload-alt" aria-hidden="true"></i>
        <span>Plano de leitura</span>
      </a>
      <a routerLink="/bible" routerLinkActive="active" class="nav-item">
        <i class="uil uil-book-open" aria-hidden="true"></i>
        <span>Bíblia</span>
      </a>
      <a routerLink="/statistics" routerLinkActive="active" class="nav-item">
        <i class="uil uil-chart-pie-alt" aria-hidden="true"></i>
        <span>Estatísticas</span>
      </a>
      <a routerLink="/settings" routerLinkActive="active" class="nav-item">
        <i class="uil uil-setting" aria-hidden="true"></i>
        <span>Ajustes</span>
      </a>
      <button type="button" class="nav-item mobile-only nav-logout" (click)="logout()">
        <i class="uil uil-sign-out-alt" aria-hidden="true"></i>
        <span>Sair</span>
      </button>
    </div>

    <div class="sidebar-footer desktop-only">
      <div class="profile-block">
        <div class="profile-info">
          <span class="name">{{ auth.user()?.name ?? 'Visitante' }}</span>
          <span class="plan">{{ sidebarPlanLabel() }}</span>
        </div>
      </div>
      <button type="button" class="btn-logout" (click)="logout()">Sair</button>
    </div>
  </nav>

  <main class="main-content">
    <router-outlet />
  </main>
</div>
