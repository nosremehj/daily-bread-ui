<header class="page-header">
  <div class="page-heading-row">
    <div class="page-heading-row__titles">
      <h1>{{ 'profile.title' | transloco }}</h1>
      <p class="subtitle">
        {{ 'profile.subtitle' | transloco }}
      </p>
    </div>
    <app-language-menu class="page-heading-row__actions" />
  </div>
</header>

@if (successMessage(); as msg) {
  <p class="banner-success" role="status">{{ msg }}</p>
}

@if (serverError(); as err) {
  <p class="banner-error" role="alert">{{ err }}</p>
}

<section class="card glass" aria-labelledby="profile-form-heading">
  <h2 id="profile-form-heading" class="section-title">{{ 'profile.accountSection' | transloco }}</h2>

  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <label class="field">
      <span class="field-label">{{ 'profile.name' | transloco }}</span>
      <input
        type="text"
        formControlName="name"
        autocomplete="name"
        class="input"
        [class.invalid]="form.controls.name.invalid && form.controls.name.touched"
      />
      @if (form.controls.name.invalid && form.controls.name.touched) {
        <span class="field-error">{{ 'profile.nameError' | transloco }}</span>
      }
    </label>

    <label class="field">
      <span class="field-label">{{ 'profile.email' | transloco }}</span>
      <input
        type="email"
        formControlName="email"
        autocomplete="email"
        class="input"
        [class.invalid]="form.controls.email.invalid && form.controls.email.touched"
      />
      @if (form.controls.email.invalid && form.controls.email.touched) {
        <span class="field-error">{{ 'profile.emailError' | transloco }}</span>
      }
    </label>

    <label class="field">
      <span class="field-label">{{ 'profile.username' | transloco }}</span>
      <input
        type="text"
        formControlName="username"
        autocomplete="username"
        class="input"
        [class.invalid]="form.controls.username.invalid && form.controls.username.touched"
      />
      @if (form.controls.username.invalid && form.controls.username.touched) {
        <span class="field-error">{{ 'profile.usernameError' | transloco }}</span>
      }
      <span class="field-hint">{{ 'profile.usernameHint' | transloco }}</span>
    </label>

    <div class="form-actions">
      <button type="submit" class="btn-primary inline" [disabled]="saving()">
        @if (saving()) {
          <span>{{ 'profile.saving' | transloco }}</span>
        } @else {
          <span>{{ 'profile.save' | transloco }}</span>
        }
      </button>
      <button type="button" class="btn-outline" (click)="openPasswordModal()">
        {{ 'profile.changePassword' | transloco }}
      </button>
    </div>
  </form>
</section>

<app-change-password-modal
  [open]="passwordModalOpen()"
  (dismiss)="closePasswordModal()"
  (passwordChanged)="onPasswordChanged()"
/>
