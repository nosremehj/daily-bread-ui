@if (open) {
  <div class="overlay" (click)="onOverlayClick()" aria-hidden="true"></div>
  <div
    class="modal glass"
    role="dialog"
    aria-modal="true"
    aria-labelledby="upload-dialog-title"
    (click)="$event.stopPropagation()"
  >
    <div class="modal-header">
      <h2 id="upload-dialog-title">{{ 'modals.upload.title' | transloco }}</h2>
      <button type="button" class="btn-icon" (click)="close()" [disabled]="uploading()" [attr.aria-label]="'common.actions.close' | transloco">
        <i class="uil uil-times" aria-hidden="true"></i>
      </button>
    </div>
    <p class="hint">
      {{ 'modals.upload.hint' | transloco }}
    </p>
    <div class="field">
      <label for="plan-pdf-file" class="file-label">{{ 'modals.upload.file' | transloco }}</label>
      <input
        #fileInput
        id="plan-pdf-file"
        type="file"
        accept="application/pdf,.pdf"
        [disabled]="uploading()"
        (change)="onFilePicked($event)"
      />
    </div>
    @if (selectedFile(); as f) {
      <p class="file-meta">{{ f.name }} · {{ f.size | number }} bytes</p>
    }
    @if (errorMessage(); as err) {
      <p class="error" role="alert">{{ err }}</p>
    }
    <div class="actions">
      <button type="button" class="btn-secondary" (click)="close()" [disabled]="uploading()">
        {{ 'modals.upload.cancel' | transloco }}
      </button>
      <button
        type="button"
        class="btn-primary inline"
        (click)="submit()"
        [disabled]="!selectedFile() || uploading()"
      >
        @if (uploading()) {
          <span>{{ 'modals.upload.uploading' | transloco }}</span>
        } @else {
          <span>{{ 'modals.upload.import' | transloco }}</span>
        }
      </button>
    </div>
  </div>
}
