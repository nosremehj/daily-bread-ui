<div class="auth-page">
  <div class="auth-card glass">
    <div class="auth-brand">
      <i class="uil uil-book-reader" aria-hidden="true"></i>
      <h1>{{ 'common.brand' | transloco }}</h1>
      <p>{{ 'auth.login.subtitle' | transloco }}</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <label class="field">
        <span class="label">{{ 'auth.login.username' | transloco }}</span>
        <input
          type="text"
          formControlName="username"
          autocomplete="username"
          class="input"
          [class.invalid]="form.controls.username.invalid && form.controls.username.touched"
        />
        @if (form.controls.username.invalid && form.controls.username.touched) {
          <span class="hint">{{ 'auth.login.usernameHint' | transloco }}</span>
        }
      </label>

      <label class="field">
        <span class="label">{{ 'auth.login.password' | transloco }}</span>
        <div class="input-password-wrap">
          <input
            [type]="showPassword() ? 'text' : 'password'"
            formControlName="password"
            autocomplete="current-password"
            class="input input--password-toggle"
            [class.invalid]="form.controls.password.invalid && form.controls.password.touched"
          />
          <button
            type="button"
            class="btn-password-toggle"
            (click)="toggleShowPassword()"
            [attr.aria-label]="(showPassword() ? 'auth.login.hidePassword' : 'auth.login.showPassword') | transloco"
            [attr.aria-pressed]="showPassword()"
          >
            @if (showPassword()) {
              <i class="uil uil-eye-slash" aria-hidden="true"></i>
            } @else {
              <i class="uil uil-eye" aria-hidden="true"></i>
            }
          </button>
        </div>
        @if (form.controls.password.invalid && form.controls.password.touched) {
          <span class="hint">{{ 'auth.login.passwordHint' | transloco }}</span>
        }
      </label>

      @if (serverError(); as err) {
        <p class="error-banner" role="alert">{{ err }}</p>
      }

      <button type="submit" class="btn-primary" [disabled]="submitting()">
        {{ submitting() ? ('auth.login.submitting' | transloco) : ('auth.login.submit' | transloco) }}
      </button>
    </form>

    <p class="auth-footer">
      {{ 'auth.login.noAccount' | transloco }}
      <a routerLink="/register">{{ 'auth.login.registerLink' | transloco }}</a>
    </p>
  </div>
</div>
