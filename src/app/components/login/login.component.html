<div class="auth-page">
  <div class="auth-card glass">
    <div class="auth-brand">
      <i class="uil uil-book-reader" aria-hidden="true"></i>
      <h1>Pão diário</h1>
      <p>Entre com seu usuário e senha</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <label class="field">
        <span class="label">Usuário</span>
        <input
          type="text"
          formControlName="username"
          autocomplete="username"
          class="input"
          [class.invalid]="form.controls.username.invalid && form.controls.username.touched"
        />
        @if (form.controls.username.invalid && form.controls.username.touched) {
          <span class="hint">Informe o usuário.</span>
        }
      </label>

      <label class="field">
        <span class="label">Senha</span>
        <input
          type="password"
          formControlName="password"
          autocomplete="current-password"
          class="input"
          [class.invalid]="form.controls.password.invalid && form.controls.password.touched"
        />
        @if (form.controls.password.invalid && form.controls.password.touched) {
          <span class="hint">Informe a senha.</span>
        }
      </label>

      @if (serverError()) {
        <p class="error-banner" role="alert">{{ serverError() }}</p>
      }

      <button type="submit" class="btn-primary" [disabled]="submitting()">
        {{ submitting() ? 'Entrando…' : 'Entrar' }}
      </button>
    </form>

    <p class="auth-footer">
      Não tem conta?
      <a routerLink="/register">Cadastre-se</a>
    </p>
  </div>
</div>
