<div class="auth-page">
  <div class="auth-card glass">
    <div class="auth-brand">
      <i class="uil uil-book-reader" aria-hidden="true"></i>
      <h1>Pão diário</h1>
      <p>Entre com seu usuário e senha</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <label class="field">
        <span class="label">Usuário</span>
        <input
          type="text"
          formControlName="username"
          autocomplete="username"
          class="input"
          [class.invalid]="form.controls.username.invalid && form.controls.username.touched"
        />
        @if (form.controls.username.invalid && form.controls.username.touched) {
          <span class="hint">Informe o usuário.</span>
        }
      </label>

      <label class="field">
        <span class="label">Senha</span>
        <div class="input-password-wrap">
          <input
            [type]="showPassword() ? 'text' : 'password'"
            formControlName="password"
            autocomplete="current-password"
            class="input input--password-toggle"
            [class.invalid]="form.controls.password.invalid && form.controls.password.touched"
          />
          <button
            type="button"
            class="btn-password-toggle"
            (click)="toggleShowPassword()"
            [attr.aria-label]="showPassword() ? 'Ocultar senha' : 'Mostrar senha'"
            [attr.aria-pressed]="showPassword()"
          >
            @if (showPassword()) {
              <i class="uil uil-eye-slash" aria-hidden="true"></i>
            } @else {
              <i class="uil uil-eye" aria-hidden="true"></i>
            }
          </button>
        </div>
        @if (form.controls.password.invalid && form.controls.password.touched) {
          <span class="hint">Informe a senha.</span>
        }
      </label>

      @if (serverError()) {
        <p class="error-banner" role="alert">{{ serverError() }}</p>
      }

      <button type="submit" class="btn-primary" [disabled]="submitting()">
        {{ submitting() ? 'Entrando…' : 'Entrar' }}
      </button>
    </form>

    <p class="auth-footer">
      Não tem conta?
      <a routerLink="/register">Cadastre-se</a>
    </p>
  </div>
</div>
