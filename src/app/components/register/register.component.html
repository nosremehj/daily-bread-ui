<div class="auth-page">
  <div class="auth-card glass">
    <div class="auth-brand">
      <i class="uil uil-book-reader" aria-hidden="true"></i>
      <h1>Criar conta</h1>
      <p>Pão diário — seu plano de leitura</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <label class="field">
        <span class="label">Nome</span>
        <input
          type="text"
          formControlName="name"
          autocomplete="name"
          class="input"
          [class.invalid]="form.controls.name.invalid && form.controls.name.touched"
        />
        @if (form.controls.name.invalid && form.controls.name.touched) {
          <span class="hint">Informe seu nome (máx. 256 caracteres).</span>
        }
      </label>

      <label class="field">
        <span class="label">E-mail</span>
        <input
          type="email"
          formControlName="email"
          autocomplete="email"
          class="input"
          [class.invalid]="form.controls.email.invalid && form.controls.email.touched"
        />
        @if (form.controls.email.invalid && form.controls.email.touched) {
          <span class="hint">Informe um e-mail válido.</span>
        }
      </label>

      <label class="field">
        <span class="label">Usuário</span>
        <input
          type="text"
          formControlName="username"
          autocomplete="username"
          class="input"
          [class.invalid]="form.controls.username.invalid && form.controls.username.touched"
        />
        @if (form.controls.username.invalid && form.controls.username.touched) {
          <span class="hint">Mínimo 3 caracteres, máximo 64.</span>
        }
      </label>

      <label class="field">
        <span class="label">Senha</span>
        <input
          type="password"
          formControlName="password"
          autocomplete="new-password"
          class="input"
          [class.invalid]="form.controls.password.invalid && form.controls.password.touched"
        />
        @if (form.controls.password.invalid && form.controls.password.touched) {
          <span class="hint">Mínimo 8 caracteres, máximo 128.</span>
        }
      </label>

      <label class="field">
        <span class="label">Confirmar senha</span>
        <input
          type="password"
          formControlName="confirmPassword"
          autocomplete="new-password"
          class="input"
          [class.invalid]="
            (form.controls.confirmPassword.invalid || form.hasError('passwordMismatch')) &&
            form.controls.confirmPassword.touched
          "
        />
        @if (form.hasError('passwordMismatch') && form.controls.confirmPassword.touched) {
          <span class="hint">As senhas não coincidem.</span>
        }
        @if (
          form.controls.confirmPassword.hasError('required') &&
          form.controls.confirmPassword.touched &&
          !form.hasError('passwordMismatch')
        ) {
          <span class="hint">Confirme a senha.</span>
        }
      </label>

      @if (serverError()) {
        <p class="error-banner" role="alert">{{ serverError() }}</p>
      }

      <button type="submit" class="btn-primary" [disabled]="submitting()">
        {{ submitting() ? 'Cadastrando…' : 'Cadastrar' }}
      </button>
    </form>

    <p class="auth-footer">
      Já tem conta?
      <a routerLink="/login">Entrar</a>
    </p>
  </div>
</div>
