<div class="auth-page">
  <div class="auth-card glass">
    <div class="auth-brand">
      <i class="uil uil-book-reader" aria-hidden="true"></i>
      <h1>{{ 'auth.register.title' | transloco }}</h1>
      <p>{{ 'auth.register.tagline' | transloco }}</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <label class="field">
        <span class="label">{{ 'auth.register.name' | transloco }}</span>
        <input
          type="text"
          formControlName="name"
          autocomplete="name"
          class="input"
          [class.invalid]="form.controls.name.invalid && form.controls.name.touched"
        />
        @if (form.controls.name.invalid && form.controls.name.touched) {
          <span class="hint">{{ 'auth.register.nameHint' | transloco }}</span>
        }
      </label>

      <label class="field">
        <span class="label">{{ 'auth.register.email' | transloco }}</span>
        <input
          type="email"
          formControlName="email"
          autocomplete="email"
          class="input"
          [class.invalid]="form.controls.email.invalid && form.controls.email.touched"
        />
        @if (form.controls.email.invalid && form.controls.email.touched) {
          <span class="hint">{{ 'auth.register.emailHint' | transloco }}</span>
        }
      </label>

      <label class="field">
        <span class="label">{{ 'auth.register.username' | transloco }}</span>
        <input
          type="text"
          formControlName="username"
          autocomplete="username"
          class="input"
          [class.invalid]="form.controls.username.invalid && form.controls.username.touched"
        />
        @if (form.controls.username.invalid && form.controls.username.touched) {
          <span class="hint">{{ 'auth.register.usernameHint' | transloco }}</span>
        }
      </label>

      <label class="field">
        <span class="label">{{ 'auth.register.password' | transloco }}</span>
        <input
          type="password"
          formControlName="password"
          autocomplete="new-password"
          class="input"
          [class.invalid]="form.controls.password.invalid && form.controls.password.touched"
        />
        @if (form.controls.password.invalid && form.controls.password.touched) {
          <span class="hint">{{ 'auth.register.passwordHint' | transloco }}</span>
        }
      </label>

      <label class="field">
        <span class="label">{{ 'auth.register.confirmPassword' | transloco }}</span>
        <input
          type="password"
          formControlName="confirmPassword"
          autocomplete="new-password"
          class="input"
          [class.invalid]="
            (form.controls.confirmPassword.invalid || form.hasError('passwordMismatch')) &&
            form.controls.confirmPassword.touched
          "
        />
        @if (form.hasError('passwordMismatch') && form.controls.confirmPassword.touched) {
          <span class="hint">{{ 'auth.register.passwordMismatch' | transloco }}</span>
        }
        @if (
          form.controls.confirmPassword.hasError('required') &&
          form.controls.confirmPassword.touched &&
          !form.hasError('passwordMismatch')
        ) {
          <span class="hint">{{ 'auth.register.confirmRequired' | transloco }}</span>
        }
      </label>

      @if (serverError(); as err) {
        <p class="error-banner" role="alert">{{ err }}</p>
      }

      <button type="submit" class="btn-primary" [disabled]="submitting()">
        {{ submitting() ? ('auth.register.submitting' | transloco) : ('auth.register.submit' | transloco) }}
      </button>
    </form>

    <p class="auth-footer">
      {{ 'auth.register.hasAccount' | transloco }}
      <a routerLink="/login">{{ 'auth.register.loginLink' | transloco }}</a>
    </p>
  </div>
</div>
